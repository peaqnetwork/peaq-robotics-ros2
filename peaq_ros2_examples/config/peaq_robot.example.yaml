# =============================================================================
# PEAQ ROBOT UNIFIED CONFIGURATION (Example)
# =============================================================================
# Copy this file to the same directory as `peaq_robot.yaml` and fill in the
# placeholders (e.g., Pinata JWT, gateway URL) before running.
#
# cp peaq_ros2_examples/config/peaq_robot.example.yaml \
#    peaq_ros2_examples/config/peaq_robot.yaml
# =============================================================================

# =============================================================================
# SHARED CONFIGURATION (used by all nodes)
# =============================================================================

# Network configuration
# Options: agung (testnet), peaq (mainnet), or custom WSS URL
network: agung

# Optional fallback RPCs (used if the primary network endpoint fails)
# Accepts a YAML list or CSV string.
network_fallbacks:
  - wss://quicknode1.peaq.xyz
  - wss://quicknode2.peaq.xyz
  - wss://peaq.api.onfinality.io/public-ws
  - wss://peaq-rpc.publicnode.com

# Wallet configuration (shared by all nodes)
wallet:
  # Path to wallet JSON file (uses Sr25519 - Substrate/Polkadot standard)
  path: /work/peaq_wallet.json
  
  # Auto-generate wallet if it doesn't exist (SAFE - never overwrites)
  # If true and wallet file doesn't exist: generates new wallet and saves to path
  # If true and wallet file exists: uses existing wallet (logs warning)
  # To regenerate: delete the wallet file first, then restart node
  auto_generate: true
  
  # Environment variable containing keystore password (optional)
  # password_env: PEAQ_ROBOT_KEY_PASSWORD
  
  # Option 3: Provide mnemonic directly (NOT recommended for production)
  # mnemonic: "word1 word2 word3 word4 word5 word6 word7 word8 word9 word10 word11 word12"
  
  # Option 4: Provide private key directly (NOT recommended for production)
  # private_key_hex: "0x1234567890abcdef..."

# =============================================================================
# PEAQOS MACHINE ONBOARDING + EVENTS (EVM)
# =============================================================================
#
# This config is consumed by `peaq_ros2_peaqos`.
#
# Security notes:
# - Wallet private keys stay in one local registry file on the robot.
# - Private keys are never accepted or returned over ROS services.
# - TOTP codes are request-only and must not be logged.
#
peaq_os:
  enabled: false

  # peaq EVM JSON-RPC endpoint used by peaq-os-sdk.
  rpc_url: "https://quicknode1.peaq.xyz"

  # Hosted peaqOS MCR API. Override with http://127.0.0.1:8000 when running
  # peaq-os-mcr-core locally via Docker.
  api_url: "https://mcr.peaq.xyz"

  faucet:
    base_url: "https://depinstation.peaq.network"
    qr_format: "svg"

  wallet_registry:
    path: "~/.peaq_robot/peaqos_wallets.json"

  defaults:
    # Optional fallbacks used when request fields are empty.
    owner_address: ""
    machine_address: ""
    proxy_address: ""

  contracts:
    # Current peaq mainnet proxy addresses from the peaqOS contract docs.
    identity_registry: "0xb53Af985765031936311273599389b5B68aC9956"
    identity_staking: "0x11c05A650704136786253e8685f56879A202b1C7"
    event_registry: "0x43c6c12eecAf4fB3F164375A9c44f8a6Efc139b9"
    machine_nft: "0x2943F80e9DdB11B9Dd275499C661Df78F5F691F9"
    did_registry: "0x0000000000000000000000000000000000000800"
    batch_precompile: "0x0000000000000000000000000000000000000805"

    # Feature-scoped: required only for smart-account and peaq-to-Base bridge calls.
    machine_account_factory: "0x4A808d5A90A2c91739E92C70aF19924e0B3D527f"
    machine_nft_adapter: "0x9AD5408702EC204441A88589B99ADfC2514AFAE6"

  operational_limits:
    # All zeros disable SDK-side event limits.
    max_value_per_tx: 0
    rate_limit_max_events: 0
    rate_limit_window_seconds: 0

# =============================================================================
# PEAQOS STREAM AGENT (SIGNED ROS 2 TOPIC RECEIPTS)
# =============================================================================
#
# This config is consumed by `peaq_ros2_stream`.
# Enroll a machine agent with allowedProviderKeys: ["stream"], then set the
# returned agent id/token here. Topic data is signed with a separate local
# Ed25519 data key and buffered locally when the API is unavailable.
#
stream_agent:
  enabled: false
  api_base_url: "http://127.0.0.1:8000"
  api_key: ""
  machine_id: ""
  agent_id: ""
  agent_token: ""
  identity_ref: ""
  policy_name: "ROS 2 Telemetry Stream"
  policy_path: ""
  signing_key_path: "~/.peaq_robot/stream_signing_key.json"
  sequence_state_path: "~/.peaq_robot/stream_sequences.json"
  chunk_storage_path: "~/.peaq_robot/stream_chunks"
  chunk_manifest_path: "~/.peaq_robot/stream_manifests/chunks.json"
  chunk_catalog_path: "~/.peaq_robot/stream_catalog.sqlite3"
  heartbeat_interval_seconds: 60

  topics:
    - topic: "/battery"
      message_type: "std_msgs/msg/String"
      qos_preset: "reliable"
      depth: 10
      field_rules:
        - path: "data"
          action: "hash"

  buffer:
    path: "~/.peaq_robot/stream_buffer.sqlite3"
    max_events: 1000
    retention_seconds: 86400
    retry_interval_seconds: 30
    overflow: "drop_oldest"

  payload:
    store_inline: false
    inline_limit_bytes: 4096

  storage:
    # local writes encrypted chunks to chunk_storage_path.
    # walrus writes the encrypted chunk locally first, then uploads ciphertext.
    # s3 works with AWS S3 and S3-compatible stores such as Backblaze B2.
    backend: local
    walrus:
      publisher_url: ""
      aggregator_url: ""
      publisher_token: ""
      epochs: 5
      permanent: true
      timeout_sec: 30.0
    s3:
      bucket: ""
      prefix: "peaq-stream"
      endpoint_url: ""
      region: ""
      access_key_id: ""
      secret_access_key: ""
      session_token: ""

  destinations:
    - backend

  key_recipients:
    # Optional recovery recipients. Each chunk key is wrapped to these public
    # keys when the chunk is created, so data can still be recovered if the
    # machine is lost.
    # - recipient_id: "owner-did-or-wallet"
    #   recipient_type: "owner"
    #   public_key_hex: ""

  peaqos_event:
    enabled: false
    node_name: "peaqos_node"
    machine_id: 0
    event_type: 1
    trust_level: 0
    source_chain_id: 0

# Logging configuration (shared by all nodes)
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO

  # Log format: human (readable), json (structured)
  format: human

# =============================================================================
# TETHER WDK CONFIGURATION (peaq EVM + USDT)
# =============================================================================
#
# This config is consumed by the `peaq_ros2_tether` node.
# The node shells out to Node.js scripts using `@tetherto/wdk-wallet-evm` and
# interacts with the configured USDT ERC-20 contract on peaq EVM.
#
# IMPORTANT SECURITY NOTES:
# - Wallet mnemonics are stored locally in ONE shared registry file on the robot.
# - Do NOT enable mnemonic export in production.
#
tether:
  enabled: false

  # EVM configuration (provider URL). Per Tether WDK docs, provider can be a URL string.
  evm:
    # peaq EVM JSON-RPC (QuickNode)
    rpc_url: "https://quicknode1.peaq.xyz"

  # USDT configuration (existing contract; do not deploy anything new).
  usdt:
    contract: "0xf4D9235269a96aaDaFc9aDAe454a0618eBE37949"
    decimals: 6

  # Shared local registry storing mnemonics for wallets created by the tether node.
  wallet_registry:
    path: "~/.peaq_robot/tether_wallets.json"
    unsafe_export_mnemonic: false

# =============================================================================
# CORE NODE CONFIGURATION
# =============================================================================

core_node:
  # Transaction confirmation mode
  # FAST: Quick confirmation, lower security (recommended for testing)
  # FINAL: Full confirmation, higher security (recommended for production)
  confirmation_mode: FAST
  
  # Event streaming configuration
  events:
    # Enable blockchain event streaming
    enabled: true
  
  # Node name (for ROS2)
  name: peaq_core_node

# =============================================================================
# EVENTS NODE CONFIGURATION
# =============================================================================

events_node:
  # Node name (for ROS2)
  name: peaq_events_node

# =============================================================================
# STORAGE BRIDGE CONFIGURATION
# =============================================================================

storage_bridge:
  # Robot identity
  robot:
    # DID is auto-derived from wallet address: did:peaq:<wallet_address>
    # No manual configuration needed!
    
    # Require DID verification on blockchain (default: true)
    # If true: verifies DID on chain, ERROR if not found or core_node unavailable
    # If false: skips verification, WARNING only (for development)
    require_did: false
  
  # Core node connection
  core:
    # Name of core node to connect to (must match core_node.name)
    node_name: peaq_core_node
  
  # Storage backend configuration
  storage:
    # Storage mode: local_ipfs, pinata, or both
    mode: pinata
    
    # Local IPFS configuration
    local_ipfs:
      # IPFS API endpoint
      api_url: http://127.0.0.1:5001
      
      # IPFS gateway URL for retrieving content
      gateway_url: http://127.0.0.1:8080/ipfs
      
      # Local directory to cache IPFS content
      save_dir: ~/.peaq_ipfs_cache
    
    # Pinata configuration (cloud IPFS pinning service)
    pinata:
      # Pinata JWT token (recommended - get from https://pinata.cloud)
      # Replace with your own JWT. Never commit real secrets to git.
      jwt: "YOUR_PINATA_JWT"
      
      # Alternative: API key/secret (if not using JWT)
      # api_key: "your_pinata_api_key"
      # api_secret: "your_pinata_api_secret"
      
      # Pinata gateway URL for retrieving content
      gateway_url: https://your-gateway.mypinata.cloud/ipfs
      
      # Enable pinning (keep content permanently on Pinata)
      pin: true
      
      # Pinning mode: upload (direct upload) or pin_by_cid (pin existing CID)
      mode: upload

  # Signature configuration
  signature:
    # Signature algorithm: sr25519 (Substrate standard, recommended) or ed25519 (legacy)
    algorithm: sr25519
    
    # Optional: Provide private key directly (NOT recommended for production)
    # Uses wallet configuration by default
    # private_key_hex: "0x..."

# =============================================================================
# HUMANOID BRIDGE CONFIGURATION
# =============================================================================

humanoids:
  # Humanoid adapter type
  # Options: unitree_g1, custom
  adapter: unitree_g1
  
  # Adapter-specific configuration
  adapter_config:
    # Maximum velocities (safety limits)
    max_linear_velocity: 1.0    # m/s
    max_angular_velocity: 2.0   # rad/s
    
    # Motion timeout (automatic stop after this duration)
    motion_timeout: 5.0  # seconds

# =============================================================================
# ADVANCED CONFIGURATION (rarely needed)
# =============================================================================

# Advanced: Override default node names
# node_names:
#   core: peaq_core_node
#   events: peaq_events_node
#   storage_bridge: peaq_storage_bridge_node
#   humanoid_bridge: peaq_humanoid_bridge_node

# Advanced: Custom network endpoints
# network_endpoints:
#   agung: wss://peaq-agung.api.onfinality.io/ws
#   peaq: wss://wss.mainnet.peaq.network

# =============================================================================
# EXAMPLE CONFIGURATIONS
# =============================================================================

# Example 1: Development setup with auto-generated wallet
# wallet:
#   path: ~/.peaq_robot/dev_wallet.json
#   auto_generate: true

# Example 2: Production setup with existing wallet
# wallet:
#   path: /secure/path/to/production_wallet.json
#   auto_generate: false

# Example 3: Development without DID verification
# storage_bridge:
#   robot:
#     require_did: false

# Example 4: Local IPFS only (no Pinata)
# storage_bridge:
#   storage:
#     mode: local_ipfs

# Example 5: Both local IPFS and Pinata
# storage_bridge:
#   storage:
#     mode: both

# Example 6: Custom humanoid adapter
# humanoids:
#   adapter: custom
#   adapter_config:
#     custom_param_1: value1
#     custom_param_2: value2

# Example 7: Production with FINAL confirmation
# core_node:
#   confirmation_mode: FINAL

# Example 8: Debug logging
# logging:
#   level: DEBUG
#   format: json
